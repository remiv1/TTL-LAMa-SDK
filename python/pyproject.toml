[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttlama-sdk"
authors = [
    { name = "Rémi Verschuur|rverschuur@audit-io.fr|", email = "rverschuur@audit-io.fr" },
]
keywords = ["TTL-LAMa", "API", "SDK"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]
version = "0.1.1"
urls = { "Repository" = "https://github.com/remiv1/TTL-LAMa-SDK" }
description = "Python client for the TTL-LAMa API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2,<3",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
maintainers = [
    { name = "Rémi Verschuur", email = "rverschuur@audit-io.fr" },
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
release = ["build>=1,<2", "twine>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttlama_sdk = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]